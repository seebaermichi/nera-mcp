name: Test

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                # The `engines` floor is >=22.12.0, so CI tests the two
                # supported lines, 22 and 24.
                node-version: [22, 24]

        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Run tests
              run: npx vitest run

    # The Claude Desktop extension on Windows: builds the .mcpb, unpacks it and
    # drives its server over stdio on the bundled runtime (create_site with a
    # real npm install through the shims, preview, stop). Needs the network.
    windows:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js 22
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Smoke-test the Desktop extension
              run: node scripts/smoke-mcpb.js
